name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب محتويات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. فك ضغط ملف الـ ZIP باسمه الصحيح
      - name: Unzip project source
        run: |
          mkdir -p extracted_project
          unzip -o "إمبراطورية-الأعمال.zip" -d extracted_project || unzip -o "*.zip" -d extracted_project
          ls -la extracted_project

      # 3. إعداد بيئة Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. البحث عن ملفات البناء وتشغيل Gradle
      - name: Find or Build APK
        run: |
          cd extracted_project
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            DIR=$(dirname "$GRADLE_PATH")
            cd "$DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug || ./gradlew build
          else
            echo "No gradlew found"
          fi

      # 5. رفع ملف الـ APK الناتج ليكون جاهزاً للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            extracted_project/**/*.apk
            **/*.apk
            
