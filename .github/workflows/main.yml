name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. فك ضغط الملف
      - name: Unzip project source
        run: |
          mkdir -p extracted_project
          unzip -o "إمبراطورية-الأعمال.zip" -d extracted_project || unzip -o "*.zip" -d extracted_project

      # 3. إعداد بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. تثبيت Gradle وإصدار Wrapper تلقائياً
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. بناء التطبيق وتوليد الـ APK
      - name: Build APK with Gradle
        run: |
          cd extracted_project
          gradle assembleDebug

      # 6. رفع ملف الـ APK الناتج جاهزاً للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/*.apk
          
