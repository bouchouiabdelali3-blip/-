name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          unzip "إمبراطورية الأشكال*" -d extracted_project || unzip *.zip -d extracted_project
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          cd extracted_project
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build APK with Gradle
        run: |
          cd extracted_project
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            echo "No gradlew found"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            extracted_project/app/build/outputs/apk/release/*.apk
            extracted_project/app/build/outputs/apk/debug/*.apk
            extracted_project/**/*.apk
            
